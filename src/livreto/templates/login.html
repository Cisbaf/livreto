{% extends 'base.html' %}

{% block body %}
    <div class="container" style="max-width: 420px; margin-top: 12vh;">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-1">Livretos</h1>
                <p class="text-muted mb-4">Acesso restrito. Entre para gerenciar os livretos.</p>

                {% if form.errors %}
                    <div class="alert alert-danger" role="alert">Usuário ou senha incorretos.</div>
                {% endif %}

                <form method="POST" action="{% url 'login' %}"> {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next }}">
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Usuário</label>
                        <input type="text" name="username" id="id_username" class="form-control" autocomplete="username" autofocus required>
                    </div>
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Senha</label>
                        <input type="password" name="password" id="id_password" class="form-control" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
